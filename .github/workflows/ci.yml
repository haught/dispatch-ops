# Tests, linters and image builds for pull requests and main. Nothing is
# published from here; release.yml publishes on v* tags, and calls this
# workflow first so a release can't skip it. Actions are pinned to commit SHAs.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
          POSTGRES_DB: dispatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dispatch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The DB tests create their own dispatch_test* databases from this.
      DISPATCH_TEST_DATABASE_URL: postgres://dispatch:dispatch@localhost:5432/dispatch_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal web/web.go)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go test -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build

  # The generated Go server and runner client, TS client and CRD match their
  # sources (api/openapi.yaml, internal/operator/api).
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 25
      - run: make generate
      - name: Check for changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date; run 'make generate' and commit the result."
            exit 1
          fi

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - run: make helm-lint
      - name: Package
        run: make chart CHART_VERSION=0.0.0-ci

  # Builds every image for amd64, runs the selftest in each starter EE, and
  # scans every image for known vulnerabilities. release.yml runs this
  # workflow first, so a release with a fixable High or Critical
  # vulnerability publishes nothing. The scanner runs here, with read-only
  # permissions, not in the jobs that can publish.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          VERSION: ci
          REVISION: ${{ github.sha }}
          GHA_CACHE: "1"
        with:
          source: .
          load: true
          set: |
            *.platform=linux/amd64
      - name: Selftest the starter EEs
        run: |
          for ee in ee-shell ee-python ee-ansible; do
            echo "::group::$ee"
            docker run --rm "dispatch-ops/$ee:dev" selftest
            echo "::endgroup::"
          done
      - id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      # Fails on High or Critical vulnerabilities that have a fix available.
      # To accept one, add it to .grype.yaml with a reason.
      - name: Scan the images
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          failed=()
          for image in server operator runner runner-base ee-shell ee-python ee-ansible; do
            echo "::group::$image"
            if ! "$GRYPE" "docker:dispatch-ops/$image:dev" --only-fixed --fail-on high; then
              failed+=("$image")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Fixable High or Critical vulnerabilities in: ${failed[*]}"
            exit 1
          fi
