# Tests, linters and image builds for pull requests and main. Nothing is
# published from here; release.yml publishes on v* tags, and calls this
# workflow first so a release can't skip it. Actions are pinned to commit SHAs.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
          POSTGRES_DB: dispatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dispatch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The DB tests create their own dispatch_test* databases from this.
      DISPATCH_TEST_DATABASE_URL: postgres://dispatch:dispatch@localhost:5432/dispatch_test?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal web/web.go)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go test -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build

  # The generated Go server and runner client, TS client and CRD match their
  # sources (api/openapi.yaml, internal/operator/api).
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 25
      - run: make generate
      - name: Check for changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date; run 'make generate' and commit the result."
            exit 1
          fi

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.22.1
      - run: make helm-lint
      - name: Package
        run: make chart CHART_VERSION=0.0.0-ci

  # Builds every image for amd64, runs the selftest in each starter EE, and
  # scans every image for known vulnerabilities. release.yml runs this
  # workflow first; the scan reports fixable High or Critical
  # vulnerabilities as warnings but doesn't block a release. The scanner
  # runs here, with read-only permissions, not in the jobs that can publish.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        env:
          VERSION: ci
          REVISION: ${{ github.sha }}
          GHA_CACHE: "1"
        with:
          source: .
          load: true
          set: |
            *.platform=linux/amd64
      - name: Selftest the starter EEs
        run: |
          for ee in ee-shell ee-python ee-ansible; do
            echo "::group::$ee"
            docker run --rm "dispatch-ops/$ee:dev" selftest
            echo "::endgroup::"
          done
      - id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      # Reports High or Critical vulnerabilities that have a fix available as
      # warnings and in the job summary; it doesn't fail the job. To silence
      # one, add it to .grype.yaml with a reason.
      - name: Scan the images
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          flagged=()
          echo "## Image scan (fixable vulnerabilities)" >> "$GITHUB_STEP_SUMMARY"
          for image in server operator runner runner-base ee-shell ee-python ee-ansible; do
            echo "::group::$image"
            status=0
            report=$("$GRYPE" "docker:dispatch-ops/$image:dev" --only-fixed --fail-on high 2>&1) || status=$?
            echo "$report"
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              flagged+=("$image")
              echo "::warning::Fixable High or Critical vulnerabilities in $image"
            fi
            { echo "### $image"; echo '```'; echo "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          if [ ${#flagged[@]} -gt 0 ]; then
            echo "::warning::Fixable High or Critical vulnerabilities in: ${flagged[*]}"
          fi
