# Publishes a release when a vX.Y.Z tag is pushed:
#
#   verify   the tag must point at a commit on main, and the full CI suite
#            (ci.yml) must pass on it; nothing is published otherwise
#   images   every image to ghcr.io/<owner>/<repo>/<name> for amd64 and arm64,
#            tagged X.Y.Z, X.Y and latest (a prerelease, vX.Y.Z-rc.1, only
#            gets its own tag), each signed with cosign (keyless)
#   release  a GitHub Release with the dispatch-runner binaries, the Helm chart
#            and SHA256SUMS, with GitHub build-provenance attestations; the
#            chart pushed to oci://ghcr.io/<owner>/<repo>/charts and signed with
#            cosign; and the chart added to the Helm repository index on gh-pages
#
# Every action is pinned to a full commit SHA (Dependabot keeps them current,
# see .github/dependabot.yml). Protect v* tags with a repository ruleset so
# only maintainers can create them.
#
# Verify a published artifact with, for example:
#   cosign verify ghcr.io/<owner>/<repo>/server:X.Y.Z \
#     --certificate-identity-regexp '^https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify dispatch-runner-linux-amd64 --repo <owner>/<repo>
#
# Cut a release with: git tag v1.2.3 && git push origin v1.2.3
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, so gh-pages index updates don't race.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  HELM_VERSION: v3.22.1

jobs:
  # The tagged commit must already be on main, so a tag pushed on an
  # unreviewed branch publishes nothing.
  on-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to publish"
            exit 1
          fi

  # The same tests, linters, generated-file checks and image builds as a pull
  # request, run on the tagged commit itself.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  images:
    needs: [on-main, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - id: version
        name: Version and tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a vX.Y.Z or vX.Y.Z-pre tag"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            tags="$version"; prerelease=true
          else
            tags="$version,${version%.*},latest"; prerelease=false
          fi
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $REGISTRY/*:{$tags}"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - id: bake
        name: Build and push
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6.10.0
        env:
          TAGS: ${{ steps.version.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ github.sha }}
          PLATFORMS: linux/amd64,linux/arm64
          GHA_CACHE: "1"
        with:
          source: .
          push: true
          provenance: mode=max
          sbom: true

      # Signs each pushed image by digest (the multi-arch index), which covers
      # all of its tags.
      - name: Sign the images
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          refs=$(jq -r '
            to_entries[]
            | select(.value["containerimage.digest"] and .value["image.name"])
            | (.value["image.name"] | split(",")[0] | sub(":[^:/]+$"; ""))
              + "@" + .value["containerimage.digest"]' <<<"$METADATA")
          if [ -z "$refs" ]; then
            echo "::error::bake reported no pushed image digests"
            exit 1
          fi
          for ref in $refs; do
            echo "Signing $ref"
            cosign sign --yes "$ref"
          done

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # cosign keyless signing and attestations
      attestations: write
    env:
      VERSION: ${{ needs.images.outputs.version }}
      PRERELEASE: ${{ needs.images.outputs.prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # No token is in the environment here: make dist and everything it runs
      # never see one.
      - name: Build release assets
        run: make dist VERSION="$VERSION" CHART_VERSION="$VERSION"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/dispatch-runner-linux-*
            dist/dispatch-ops-operator-*.tgz
            dist/SHA256SUMS

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --title "$GITHUB_REF_NAME" "${flags[@]}" dist/*
          fi

      - name: Push and sign the chart on GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          out=$(helm push "dist/dispatch-ops-operator-$VERSION.tgz" "oci://$REGISTRY/charts" 2>&1)
          echo "$out"
          digest=$(sed -nE 's/^Digest: (sha256:[0-9a-f]{64})$/\1/p' <<<"$out")
          if [ -z "$digest" ]; then
            echo "::error::helm push printed no digest"
            exit 1
          fi
          cosign sign --yes "$REGISTRY/charts/dispatch-ops-operator@$digest"

      # The Helm repository (https://<owner>.github.io/<repo>) is only
      # index.yaml on the gh-pages branch; chart downloads come from the
      # GitHub Release.
      - name: Update the Helm repository index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git worktree add pages FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages pages
          fi

          mkdir -p "$RUNNER_TEMP/chart"
          cp "dist/dispatch-ops-operator-$VERSION.tgz" "$RUNNER_TEMP/chart/"
          merge=()
          if [ -f pages/index.yaml ]; then merge=(--merge pages/index.yaml); fi
          helm repo index "$RUNNER_TEMP/chart" "${merge[@]}" \
            --url "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME"
          cp "$RUNNER_TEMP/chart/index.yaml" pages/index.yaml
          touch pages/.nojekyll

          cd pages
          git add index.yaml .nojekyll
          if git diff --cached --quiet; then
            echo "index.yaml already lists $VERSION"
          else
            git commit -m "dispatch-ops-operator $VERSION"
            git push origin HEAD:gh-pages
          fi
