      operationId: listJobs
      tags: [jobs]
      summary: List jobs, newest first
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/JobStatus"
        - name: jobTemplateId
          in: query
          schema:
            type: string
            format: uuid
        - name: scheduleId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a job
      description: |
        A pending job is canceled at once. A job that has started is asked to
        stop: the runner sends SIGTERM, then SIGKILL after a grace period, and
        the job ends as `canceled`.
      responses:
        "202":
          description: Cancellation requested (or done, for a pending job)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The job has already finished
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/jobs/{jobId}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: listJobEvents
      tags: [jobs]
      summary: Page through a job's output events
      description: |
        Returns events in sequence order. To get the next page, pass the last
        event's `seq` as `afterSeq`.
      parameters:
        - name: afterSeq
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
        - name: hostName
          in: query
          description: Only events about this host (Ansible jobs)
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Events after `afterSeq`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs/{jobId}/hosts:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: listJobHosts
      tags: [jobs]
      summary: Per-host results of an Ansible job
      description: |
        One entry per host the playbook ran against, by host name. While the
        job runs, the counts come from the task results received so far; once
        the playbook finishes they are Ansible's own recap. Jobs of other
        types have no entries.
      responses:
        "200":
          description: Host results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobHostSummaryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs/{jobId}/stream:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: streamJob
      tags: [jobs]
      summary: Follow a job's output live (server-sent events)
      description: |
        A `text/event-stream` with these events:

        - `job_event`: one output event (a `JobEvent`). The SSE `id` is its
          `seq`, so a reconnecting `EventSource` resumes where it left off.
        - `status`: the job (a `Job`) whenever its status changes, and once
          when the stream opens.
        - `end`: the job has finished and all of its output has been sent.
          The server then closes the stream.
      parameters:
        - name: afterSeq
          in: query
          description: Start after this event. `Last-Event-ID` takes precedence.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs/{jobId}/relaunch:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: relaunchJob
      tags: [jobs]
      summary: Run a job again
      description: |
        Queues a new job with the same configuration as this one (the same
        resolved template, overrides, image and project ref), whether or not
        the template has changed since. With `hosts: failed`, an Ansible job
        is rerun only against the hosts that failed or were unreachable.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelaunchRequest"
      responses:
        "201":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The job hasn't finished (only for `hosts: failed`)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/jobs/{jobId}/notifications:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: listJobNotifications
      tags: [jobs, notifications]
      summary: List the notifications sent (or being sent) about a job
      responses:
        "200":
          description: The job's notifications, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeliveryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Schedules -------------------------------------------------------------

  /api/v1/schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List schedules
      description: Sorted by template name, then schedule name.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
        - name: jobTemplateId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Create a schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreate"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/schedules/{scheduleId}:
    parameters:
      - $ref: "#/components/parameters/ScheduleId"
    get:
      operationId: getSchedule
      tags: [schedules]
      summary: Get a schedule
      responses:
        "200":
          description: The schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSchedule
      tags: [schedules]
      summary: Update a schedule
      description: |
        Changing `cron`, `timezone` or `enabled` plans the next run afresh
        from now.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdate"
      responses:
        "200":
          description: The updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Delete a schedule
      description: Jobs it launched are kept.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/schedule-preview:
    get:
      operationId: previewSchedule
      tags: [schedules]
      summary: Check a cron expression and list its next run times
      parameters:
        - name: cron
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CronExpression"
        - name: timezone
          in: query
          schema:
            $ref: "#/components/schemas/Timezone"
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        "200":
          description: The next run times
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # --- Notifications ---------------------------------------------------------

  /api/v1/notification-targets:
    get:
      operationId: listNotificationTargets
      tags: [notifications]
      summary: List notification targets
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: |
            A page of notification targets. Secret values are never
            returned, and `config` is empty unless the caller is a system
            administrator or auditor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTargetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createNotificationTarget
      tags: [notifications]
      summary: Create a notification target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTargetCreate"
      responses:
        "201":
          description: Notification target created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/notification-targets/{targetId}:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: getNotificationTarget
      tags: [notifications]
      summary: Get a notification target
      responses:
        "200":
          description: The notification target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTarget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateNotificationTarget
      tags: [notifications]
      summary: Update a notification target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTargetUpdate"
      responses:
        "200":
          description: The updated notification target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTarget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteNotificationTarget
      tags: [notifications]
      summary: Delete a notification target
      description: It is removed from every template, and its unsent notifications are dropped.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/notification-targets/{targetId}/test:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: testNotificationTarget
      tags: [notifications]
      summary: Send a test notification
      description: Sends at once, from the API server, and reports the result.
      responses:
        "200":
          description: Whether the test notification was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Runner ----------------------------------------------------------------

  /runner/v1/jobs/{jobId}/spec:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getRunnerJobSpec
      tags: [runner]
      summary: Fetch the job to run, including decrypted credentials
      description: |
        Can be called once per job. It moves the job to `running`. A runner
        whose protocol version is not supported makes the job fail with an
        explanation.
      security:
        - jobToken: []
      parameters:
        - name: protocol
          in: query
          required: true
          description: The runner protocol version the runner speaks
          schema:
            type: integer
            minimum: 1
        - name: version
          in: query
          required: true
          description: The runner's release version, for display
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: The job specification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerJobSpec"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /runner/v1/jobs/{jobId}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: postRunnerJobEvents
      tags: [runner]
      summary: Append output events
      description: |
        Events are keyed by `seq`, so a retried batch is stored once. Send
        batches in order and wait for each to be accepted.
      security:
        - jobToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerEventBatch"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerJobState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /runner/v1/jobs/{jobId}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: runnerHeartbeat
      tags: [runner]
      summary: Report that the job is still running
      description: The response says whether the job should be canceled.
      security:
        - jobToken: []
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerJobState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /runner/v1/jobs/{jobId}/finish:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: finishRunnerJob
      tags: [runner]
      summary: Report the job's final status
      description: Send all events first. The job token stops working afterwards.
      security:
        - jobToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunnerFinish"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dispatch_session
    bearerAuth:
      type: http
      scheme: bearer
    jobToken:
      type: http
      scheme: bearer
      description: One-time token given to a job's runner (`doj_…`)

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Search:
      name: search
      in: query
      description: Case-insensitive substring match on the name
      schema:
        type: string
        maxLength: 255
    InventoryId:
      name: inventoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HostId:
      name: hostId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExecutionEnvironmentId:
      name: executionEnvironmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobTemplateId:
      name: jobTemplateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TargetId:
      name: targetId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request was invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Not signed in, or the credentials are invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Signed in, but not allowed to do this
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state, e.g. the name is taken
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      description: RFC 9457 problem details
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, unavailable]
        version:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 1024

    User:
      type: object
      required: [id, username, displayName, email, authSource, isAdmin, isAuditor, isActive, createdAt, lastLoginAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        authSource:
          type: string
          enum: [local, oidc]
        isAdmin:
          type: boolean
          description: Holds the system_admin role, directly or through a team
        isAuditor:
          type: boolean
          description: Holds the auditor role, directly or through a team
        isActive:
          type: boolean
          description: Inactive users can't sign in, and their API tokens don't work
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    ApiToken:
      type: object
      required: [id, name, scope, prefix, createdAt, expiresAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scope:
          $ref: "#/components/schemas/TokenScope"
        prefix:
          type: string
          description: First characters of the token, to help tell tokens apart
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    CreateApiTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 3650
          description: Omit for a token that never expires
        scope:
          allOf:
            - $ref: "#/components/schemas/TokenScope"
          default: write

    CreatedApiToken:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The token secret. Shown only once.

    AuthConfig:
      type: object
      required: [oidcEnabled, oidcDisplayName]
      properties:
        oidcEnabled:
          type: boolean
          description: Whether single sign-on (`GET /api/v1/auth/oidc/login`) is configured
        oidcDisplayName:
          type: string
          description: Name of the sign-on provider, for the sign-in button

    UserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer

    Username:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^\S+$'

    Password:
      type: string
      minLength: 12
      maxLength: 1024

    UserCreate:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          $ref: "#/components/schemas/Username"
        displayName:
          type: string
          maxLength: 255
        email:
          type: string
          maxLength: 255
        password:
          $ref: "#/components/schemas/Password"

    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        username:
          allOf:
            - $ref: "#/components/schemas/Username"
          description: Local users only
        displayName:
          type: string
          maxLength: 255
        email:
          type: string
          maxLength: 255
        isActive:
          type: boolean
        password:
          allOf:
            - $ref: "#/components/schemas/Password"
          description: Local users only

    ApiTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"

    TokenScope:
      type: string
      description: "`read` tokens may only make GET requests; `write` tokens may do anything their user may."
      enum: [read, write]

    # --- Teams ---

    TeamRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    OidcGroups:
      type: array
      description: |
        Values of the OIDC groups claim. Users signing in with any of them
        join the team; those signing in without them leave it again.
      maxItems: 100
      items:
        type: string
        minLength: 1
        maxLength: 255

    Team:
      type: object
      required: [id, name, description, oidcGroups, memberCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        oidcGroups:
          type: array
          items:
            type: string
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TeamCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        oidcGroups:
          $ref: "#/components/schemas/OidcGroups"

    TeamUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        oidcGroups:
          $ref: "#/components/schemas/OidcGroups"

    TeamList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        total:
          type: integer

    TeamMember:
      type: object
      required: [user, displayName, source, addedAt]
      properties:
        user:
          $ref: "#/components/schemas/UserRef"
        displayName:
          type: string
        source:
          type: string
          enum: [manual, oidc]
          description: "`manual`: added through the API. `oidc`: from the OIDC groups claim at sign-in."
        addedAt:
          type: string
          format: date-time

    TeamMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"

    # --- Roles ---

    Role:
      type: string
      description: |
        On a resource: `admin` (edit, delete, grant roles on it; includes
        the others), `use` (reference it from a job template; inventories,
        credentials and projects), `execute` (launch it; job templates) and
        `read`. Global: `system_admin` (everything) and `auditor` (read
        everything, including the audit log).
      enum: [admin, use, execute, read, system_admin, auditor]

    ResourceType:
      type: string
      enum: [inventory, credential, project, job_template]

    RoleGrant:
      type: object
      required: [id, role, resourceType, resourceId, resourceName, user, team, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        resourceType:
          allOf:
            - $ref: "#/components/schemas/ResourceType"
          nullable: true
          description: "`null` for a global role"
        resourceId:
          type: string
          format: uuid
          nullable: true
          description: "`null` for a global role, or a role on every resource of the type"
        resourceName:
          type: string
        user:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
          description: The user holding the role, if granted to a user
        team:
          allOf:
            - $ref: "#/components/schemas/TeamRef"
          nullable: true
          description: The team holding the role, if granted to a team
        createdAt:
          type: string
          format: date-time

    RoleGrantCreate:
      type: object
      required: [role]
      additionalProperties: false
      description: |
        Give exactly one of `userId` and `teamId`. Omit `resourceType` for a
        global role. Omit `resourceId` to grant the role on every resource of
        the type; `admin` on a type also allows creating resources of it.
      properties:
        role:
          $ref: "#/components/schemas/Role"
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        resourceId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid

    RoleGrantList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoleGrant"
        total:
          type: integer

    # --- Audit log ---

    AuditAction:
      type: string
      enum: [create, update, delete, launch, cancel, login, grant, revoke, add_member, remove_member]

    AuditResourceType:
      type: string
      enum:
        - inventory
        - host
        - group
        - credential
        - execution_environment
        - project
        - job_template
        - job
        - user
        - team
        - api_token
        - schedule
        - notification_target

    AuditEntry:
      type: object
      required: [id, time, actor, actorName, authMethod, action, resourceType, resourceId, resourceName, before, after]
      properties:
        id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        actor:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
          description: "`null` if the user has since been deleted"
        actorName:
          type: string
          description: The actor's username at the time
        authMethod:
          type: string
          description: |
            How the actor authenticated: `session`, `api_token`, `password`
            or `oidc` (sign-ins), or `cli` (`dispatch-ops user create` and
            `user grant-admin`)
        action:
          $ref: "#/components/schemas/AuditAction"
        resourceType:
          $ref: "#/components/schemas/AuditResourceType"
        resourceId:
          type: string
          format: uuid
          nullable: true
        resourceName:
          type: string
        before:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            The resource before the change (as the API shows it, so never
            secrets). For updates, only the fields that changed.
        after:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            The resource after the change. For updates, only the fields that
            changed. Role grants, team membership changes and launches record
            what was granted, added or launched here.

    AuditEntryList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        total:
          type: integer

    # --- Shared field types ---

    Name:
      type: string
      minLength: 1
      maxLength: 255
    Description:
      type: string
      maxLength: 4096
    Variables:
      type: object
      description: Variables as a JSON object (e.g. Ansible variables)
      additionalProperties: true

    # --- Inventories ---

    Inventory:
      type: object
      required: [id, name, description, variables, hostCount, groupCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        variables:
          $ref: "#/components/schemas/Variables"
        hostCount:
          type: integer
        groupCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InventoryCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        variables:
          $ref: "#/components/schemas/Variables"

    InventoryUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        variables:
          $ref: "#/components/schemas/Variables"

    InventoryList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Inventory"
        total:
          type: integer

    InventoryExport:
      type: object
      description: |
        Ansible JSON inventory: one key per group (`hosts`, `vars`,
        `children`), plus `all`, `ungrouped` and `_meta.hostvars`.
      additionalProperties: true

    HostName:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^\S+$'
      description: Host name or address, as Ansible will see it. No whitespace.

    Host:
      type: object
      required: [id, inventoryId, name, description, variables, enabled, groupIds, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        inventoryId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        variables:
          $ref: "#/components/schemas/Variables"
        enabled:
          type: boolean
          description: Disabled hosts are left out of job inventories
        groupIds:
          type: array
          description: Groups the host is a direct member of
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HostCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/HostName"
        description:
          $ref: "#/components/schemas/Description"
        variables:
          $ref: "#/components/schemas/Variables"
        enabled:
          type: boolean
          default: true
        groupIds:
          type: array
          maxItems: 1000
          items:
            type: string
            format: uuid

    HostUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/HostName"
        description:
          $ref: "#/components/schemas/Description"
        variables:
          $ref: "#/components/schemas/Variables"
        enabled:
          type: boolean
        groupIds:
          type: array
          description: Replaces the host's group memberships
          maxItems: 1000
          items:
            type: string
            format: uuid

    HostList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Host"
        total:
          type: integer

    GroupName:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
      description: |
        A valid Ansible group name: letters, digits and underscores, not
        starting with a digit. `all` and `ungrouped` are reserved.

    Group:
      type: object
      required: [id, inventoryId, name, description, variables, childIds, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        inventoryId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        variables:
          $ref: "#/components/schemas/Variables"
        childIds:
          type: array
          description: Direct child groups
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/GroupName"
        description:
          $ref: "#/components/schemas/Description"
        variables:
          $ref: "#/components/schemas/Variables"
        childIds:
          type: array
          maxItems: 1000
          items:
            type: string
            format: uuid

    GroupUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/GroupName"
        description:
          $ref: "#/components/schemas/Description"
        variables:
          $ref: "#/components/schemas/Variables"
        childIds:
          type: array
          description: Replaces the group's children. Cycles are rejected.
          maxItems: 1000
          items:
            type: string
            format: uuid

    GroupList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        total:
          type: integer

    # --- Credentials ---

    CredentialKind:
      type: string
      enum: [ssh, username_password, api_token, registry, scm, vault, generic]

    CredentialKindInfo:
      type: object
      required: [kind, label, freeform, fields]
      properties:
        kind:
          $ref: "#/components/schemas/CredentialKind"
        label:
          type: string
        freeform:
          type: boolean
          description: Any input names are accepted, and all values are secret
        fields:
          type: array
          items:
            $ref: "#/components/schemas/CredentialField"

    CredentialField:
      type: object
      required: [name, label, secret, required, multiline]
      properties:
        name:
          type: string
        label:
          type: string
        secret:
          type: boolean
          description: Secret values are encrypted and never returned by the API
        required:
          type: boolean
        multiline:
          type: boolean

    Credential:
      type: object
      required: [id, name, description, kind, publicInputs, secretFields, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        kind:
          $ref: "#/components/schemas/CredentialKind"
        publicInputs:
          type: object
          description: Values of the non-secret fields
          additionalProperties:
            type: string
        secretFields:
          type: array
          description: Names of the secret fields that have a value
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CredentialInputs:
      type: object
      description: Field values, by field name (see `GET /credential-kinds`)
      maxProperties: 100
      additionalProperties:
        type: string
        maxLength: 65536

    CredentialCreate:
      type: object
      required: [name, kind, inputs]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        kind:
          $ref: "#/components/schemas/CredentialKind"
        inputs:
          $ref: "#/components/schemas/CredentialInputs"

    CredentialUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        inputs:
          allOf:
            - $ref: "#/components/schemas/CredentialInputs"
          description: |
            Merged into the existing inputs: fields given here are replaced,
            others are kept. An empty string removes a field.

    CredentialList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        total:
          type: integer

    # --- Execution environments ---

    ImageReference:
      type: string
      minLength: 1
      maxLength: 512
      pattern: '^\S+$'
      description: Container image, e.g. `ghcr.io/acme/ee-shell:1.2` or `…@sha256:…`

    PullPolicy:
      type: string
      enum: [Always, IfNotPresent, Never]

    ExecutionEnvironment:
      type: object
      required: [id, name, description, image, pullPolicy, registryCredentialId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        image:
          type: string
        pullPolicy:
          $ref: "#/components/schemas/PullPolicy"
        registryCredentialId:
          type: string
          format: uuid
          nullable: true
          description: A `registry` credential used to pull the image
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ExecutionEnvironmentCreate:
      type: object
      required: [name, image]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        image:
          $ref: "#/components/schemas/ImageReference"
        pullPolicy:
          allOf:
            - $ref: "#/components/schemas/PullPolicy"
          default: IfNotPresent
        registryCredentialId:
          type: string
          format: uuid

    ExecutionEnvironmentUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        image:
          $ref: "#/components/schemas/ImageReference"
        pullPolicy:
          $ref: "#/components/schemas/PullPolicy"
        registryCredentialId:
          type: string
          format: uuid
          nullable: true
          description: "`null` removes the registry credential"
          # Tells an absent field (leave unchanged) apart from null (clear).
          x-go-type: nullable.Nullable[openapi_types.UUID]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable

    ExecutionEnvironmentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionEnvironment"
        total:
          type: integer

    # --- Projects ---

    ScmUrl:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: '^[^\s-]\S*$'
      description: |
        Git repository URL: `https://`, `http://`, `ssh://`, `git://`,
        `file://`, or scp-like `git@host:path`.

    ScmRef:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[^\s-]\S*$'
      description: Branch, tag or commit to check out

    Project:
      type: object
      required: [id, name, description, scmUrl, scmRef, credentialId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        scmUrl:
          type: string
        scmRef:
          type: string
        credentialId:
          type: string
          format: uuid
          nullable: true
          description: An `scm` credential used to clone the repository
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required: [name, scmUrl]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        scmUrl:
          $ref: "#/components/schemas/ScmUrl"
        scmRef:
          allOf:
            - $ref: "#/components/schemas/ScmRef"
          default: main
        credentialId:
          type: string
          format: uuid

    ProjectUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        scmUrl:
          $ref: "#/components/schemas/ScmUrl"
        scmRef:
          $ref: "#/components/schemas/ScmRef"
        credentialId:
          type: string
          format: uuid
          nullable: true
          description: "`null` removes the credential"
          x-go-type: nullable.Nullable[openapi_types.UUID]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable

    ProjectList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        total:
          type: integer

    # --- Job templates ---

    JobType:
      type: string
      enum: [ansible, script, container]
      description: |
        `ansible` runs a playbook from a project with `ansible-playbook`.
        `script` runs a script from a project. `container` runs a command in
        the execution environment, without a project.

    Command:
      type: array
      description: The program and its arguments. Not run through a shell.
      minItems: 1
      maxItems: 1000
      items:
        type: string
        maxLength: 65536

    Arguments:
      type: array
      description: Arguments passed to the script
      maxItems: 1000
      items:
        type: string
        maxLength: 65536

    Entrypoint:
      type: string
      maxLength: 1024
      description: |
        Path of the playbook (`ansible`) or script (`script`) within the
        project, e.g. `playbooks/site.yml`.

    AnsibleTags:
      type: string
      maxLength: 4096
      description: Comma-separated Ansible tags

    Verbosity:
      type: integer
      minimum: 0
      maximum: 5
      description: Ansible verbosity (the number of `-v` flags)

    OverridableField:
      type: string
      enum: [inventory, extraVars, limit, command, tags, skipTags]

    JobTemplate:
      type: object
      required:
        - id
        - name
        - description
        - jobType
        - executionEnvironmentId
        - projectId
        - entrypoint
        - inventoryId
        - credentialIds
        - command
        - arguments
        - extraVars
        - limit
        - tags
        - skipTags
        - verbosity
        - timeoutSeconds
        - allowOverrides
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        jobType:
          $ref: "#/components/schemas/JobType"
        executionEnvironmentId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          nullable: true
          description: The project (`ansible` and `script` jobs)
        entrypoint:
          type: string
          description: Playbook or script path within the project
        inventoryId:
          type: string
          format: uuid
          nullable: true
        credentialIds:
          type: array
          items:
            type: string
            format: uuid
        command:
          type: array
          description: The command (`container` jobs)
          items:
            type: string
        arguments:
          type: array
          description: Arguments passed to the script (`script` jobs)
          items:
            type: string
        extraVars:
          $ref: "#/components/schemas/Variables"
        limit:
          type: string
          description: Host pattern to restrict the job to (Ansible `--limit`)
        tags:
          type: string
          description: Only run tasks with these tags (Ansible `--tags`)
        skipTags:
          type: string
          description: Skip tasks with these tags (Ansible `--skip-tags`)
        verbosity:
          type: integer
        timeoutSeconds:
          type: integer
        allowOverrides:
          type: array
          items:
            $ref: "#/components/schemas/OverridableField"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobTemplateCreate:
      type: object
      description: |
        `ansible` and `script` templates need `projectId` and `entrypoint`;
        `container` templates need `command`.
      required: [name, jobType, executionEnvironmentId]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        jobType:
          $ref: "#/components/schemas/JobType"
        executionEnvironmentId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        entrypoint:
          $ref: "#/components/schemas/Entrypoint"
        inventoryId:
          type: string
          format: uuid
        credentialIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        command:
          $ref: "#/components/schemas/Command"
        arguments:
          $ref: "#/components/schemas/Arguments"
        extraVars:
          $ref: "#/components/schemas/Variables"
        limit:
          type: string
          maxLength: 4096
        tags:
          $ref: "#/components/schemas/AnsibleTags"
        skipTags:
          $ref: "#/components/schemas/AnsibleTags"
        verbosity:
          $ref: "#/components/schemas/Verbosity"
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 604800
          default: 3600
        allowOverrides:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/OverridableField"

    JobTemplateUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        executionEnvironmentId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        entrypoint:
          $ref: "#/components/schemas/Entrypoint"
        inventoryId:
          type: string
          format: uuid
          nullable: true
          description: "`null` removes the inventory"
          x-go-type: nullable.Nullable[openapi_types.UUID]
          x-go-type-skip-optional-pointer: true
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
        credentialIds:
          type: array
          description: Replaces the template's credentials
          maxItems: 50
          items:
            type: string
            format: uuid
        command:
          $ref: "#/components/schemas/Command"
        arguments:
          $ref: "#/components/schemas/Arguments"
        extraVars:
          $ref: "#/components/schemas/Variables"
        limit:
          type: string
          maxLength: 4096
        tags:
          $ref: "#/components/schemas/AnsibleTags"
        skipTags:
          $ref: "#/components/schemas/AnsibleTags"
        verbosity:
          $ref: "#/components/schemas/Verbosity"
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 604800
        allowOverrides:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/OverridableField"

    JobTemplateList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobTemplate"
        total:
          type: integer

    LaunchRequest:
      type: object
      additionalProperties: false
      properties:
        inventoryId:
          type: string
          format: uuid
        extraVars:
          allOf:
            - $ref: "#/components/schemas/Variables"
          description: Merged over the template's extra vars (top-level keys replace)
        limit:
          type: string
          maxLength: 4096
        command:
          $ref: "#/components/schemas/Command"
        tags:
          $ref: "#/components/schemas/AnsibleTags"
        skipTags:
          $ref: "#/components/schemas/AnsibleTags"

    # --- Jobs ---

    JobStatus:
      type: string
      description: |
        `pending`: queued. `waiting`: the Kubernetes Job was created and the
        runner has not started yet. `running`: the runner is executing it.
        `successful`, `failed` (the command failed), `error` (the system could
        not run it) and `canceled` are final.
      enum: [pending, waiting, running, successful, failed, error, canceled]

    UserRef:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string

    ExecutionEnvironmentRef:
      type: object
      required: [id, name, image, pullPolicy]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        image:
          type: string
        pullPolicy:
          $ref: "#/components/schemas/PullPolicy"

    JobConfig:
      type: object
      description: The configuration the job runs with, resolved at launch
      required:
        - jobType
        - executionEnvironment
        - project
        - entrypoint
        - inventoryId
        - credentialIds
        - command
        - arguments
        - extraVars
        - limit
        - tags
        - skipTags
        - verbosity
        - timeoutSeconds
      properties:
        jobType:
          $ref: "#/components/schemas/JobType"
        executionEnvironment:
          $ref: "#/components/schemas/ExecutionEnvironmentRef"
        project:
          allOf:
            - $ref: "#/components/schemas/ProjectRef"
          nullable: true
        entrypoint:
          type: string
        inventoryId:
          type: string
          format: uuid
          nullable: true
        credentialIds:
          type: array
          items:
            type: string
            format: uuid
        command:
          type: array
          items:
            type: string
        arguments:
          type: array
          items:
            type: string
        extraVars:
          $ref: "#/components/schemas/Variables"
        limit:
          type: string
        tags:
          type: string
        skipTags:
          type: string
        verbosity:
          type: integer
        timeoutSeconds:
          type: integer

    ProjectRef:
      type: object
      description: The project's repository as it was when the job was launched
      required: [id, name, scmUrl, scmRef]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scmUrl:
          type: string
        scmRef:
          type: string

    Job:
      type: object
      required:
        - id
        - name
        - jobTemplateId
        - status
        - launchType
        - launchedBy
        - schedule
        - relaunchOf
        - config
        - cancelRequested
        - exitCode
        - failureReason
        - scmRevision
        - createdAt
        - startedAt
        - finishedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        jobTemplateId:
          type: string
          format: uuid
          nullable: true
          description: "`null` if the template has since been deleted"
        status:
          $ref: "#/components/schemas/JobStatus"
        launchType:
          type: string
          enum: [manual, api, schedule, relaunch]
        launchedBy:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
          description: "`null` for scheduled jobs, or if the user has since been deleted"
        schedule:
          allOf:
            - $ref: "#/components/schemas/ScheduleRef"
          nullable: true
          description: The schedule that launched the job, if one did and it still exists
        relaunchOf:
          type: string
          format: uuid
          nullable: true
          description: The job this one reran, if it still exists
        config:
          $ref: "#/components/schemas/JobConfig"
        cancelRequested:
          type: boolean
        exitCode:
          type: integer
          nullable: true
        failureReason:
          type: string
          description: Why the job failed, errored or was canceled, if known
        scmRevision:
          type: string
          description: The commit the project was checked out at (empty if unknown)
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true

    JobList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        total:
          type: integer

    JobEvent:
      type: object
      required: [seq, time, type, stdout, hostName, data]
      properties:
        seq:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        type:
          type: string
          description: |
            `stdout` for command output, `runner` for messages from the
            runner. Ansible jobs also have structured events, whose `stdout`
            is empty and whose `data` holds the details: `playbook_start`,
            `play_start`, `task_start`, `host_ok`, `host_failed`,
            `host_skipped`, `host_unreachable` (these four have a
            `hostName`) and `playbook_stats`.
        stdout:
          type: string
        hostName:
          type: string
          nullable: true
        data:
          type: object
          nullable: true
          additionalProperties: true

    JobEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobEvent"

    JobHostSummary:
      type: object
      required: [hostName, status, ok, changed, failed, unreachable, skipped, rescued, ignored]
      properties:
        hostName:
          type: string
        status:
          type: string
          description: The host's overall result, the worst of its task results
          enum: [ok, changed, failed, unreachable, skipped]
        ok:
          type: integer
          description: Tasks that succeeded, including changed ones
        changed:
          type: integer
        failed:
          type: integer
        unreachable:
          type: integer
        skipped:
          type: integer
        rescued:
          type: integer
        ignored:
          type: integer
          description: Failed tasks with `ignore_errors`

    JobHostSummaryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobHostSummary"

    RelaunchRequest:
      type: object
      additionalProperties: false
      properties:
        hosts:
          type: string
          enum: [all, failed]
          default: all
          description: |
            `failed` reruns a finished Ansible job only against the hosts that
            failed or were unreachable (as its `limit`).

    # --- Schedules ---

    CronExpression:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        Five fields (minute hour day-of-month month day-of-week, e.g.
        `30 2 * * 1-5`) or a descriptor: `@yearly`, `@monthly`, `@weekly`,
        `@daily`, `@hourly`, or `@every <duration>` (at least `1m`).
      example: "0 3 * * *"

    Timezone:
      type: string
      maxLength: 64
      default: UTC
      description: IANA time zone the cron expression is read in
      example: Europe/Berlin

    ScheduleRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Schedule:
      type: object
      required:
        - id
        - name
        - description
        - jobTemplateId
        - jobTemplateName
        - cron
        - timezone
        - enabled
        - overrides
        - nextRunAt
        - lastRunAt
        - lastJobId
        - lastError
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        jobTemplateId:
          type: string
          format: uuid
        jobTemplateName:
          type: string
        cron:
          $ref: "#/components/schemas/CronExpression"
        timezone:
          $ref: "#/components/schemas/Timezone"
        enabled:
          type: boolean
        overrides:
          $ref: "#/components/schemas/LaunchRequest"
        nextRunAt:
          type: string
          format: date-time
          nullable: true
          description: "`null` while disabled"
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastJobId:
          type: string
          format: uuid
          nullable: true
          description: The last job it launched, if it still exists
        lastError:
          type: string
          description: Why the last run could not launch a job (empty if it did)
        createdBy:
          allOf:
            - $ref: "#/components/schemas/UserRef"
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ScheduleCreate:
      type: object
      required: [name, jobTemplateId, cron]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        jobTemplateId:
          type: string
          format: uuid
        cron:
          $ref: "#/components/schemas/CronExpression"
        timezone:
          $ref: "#/components/schemas/Timezone"
        enabled:
          type: boolean
          default: true
        overrides:
          allOf:
            - $ref: "#/components/schemas/LaunchRequest"
          description: Launch overrides, as in a launch request; the template must allow them

    ScheduleUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        cron:
          $ref: "#/components/schemas/CronExpression"
        timezone:
          $ref: "#/components/schemas/Timezone"
        enabled:
          type: boolean
        overrides:
          allOf:
            - $ref: "#/components/schemas/LaunchRequest"
          description: Replaces the overrides

    ScheduleList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        total:
          type: integer

    SchedulePreview:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            type: string
            format: date-time

    # --- Notifications ---

    NotificationKind:
      type: string
      description: |
        - `webhook`: POSTs the event as JSON to `config.url`. Optional
          secrets: `authorization` (sent as the `Authorization` header) and
          `signingSecret`, which adds `X-Dispatch-Timestamp` and
          `X-Dispatch-Signature: sha256=<hex HMAC-SHA256 of "<timestamp>.<body>">`.
        - `slack`: posts a message to a Slack incoming webhook. Secret:
          `webhookUrl` (required).
        - `email`: sends an email over SMTP. Config: `host`, `port` (default
          587, or 465 with `tls`), `security` (`starttls` (default), `tls` or
          `none`), `username`, `from`, `to` (a list). Secret: `password`.
      enum: [webhook, slack, email]

    NotificationEvent:
      type: string
      description: "`failed` covers jobs that failed or errored."
      enum: [started, succeeded, failed, canceled]

    NotificationTarget:
      type: object
      required: [id, name, description, kind, config, secretFields, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        kind:
          $ref: "#/components/schemas/NotificationKind"
        config:
          type: object
          additionalProperties: true
          description: Non-secret settings (empty unless the caller is a system administrator or auditor)
        secretFields:
          type: array
          description: Names of the secrets that have a value
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NotificationSecrets:
      type: object
      description: Secret values by name (see `NotificationKind`). Never returned by the API.
      maxProperties: 10
      additionalProperties:
        type: string
        maxLength: 8192

    NotificationTargetCreate:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        kind:
          $ref: "#/components/schemas/NotificationKind"
        config:
          type: object
          additionalProperties: true
        secrets:
          $ref: "#/components/schemas/NotificationSecrets"

    NotificationTargetUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          $ref: "#/components/schemas/Description"
        config:
          type: object
          additionalProperties: true
          description: Replaces the config
        secrets:
          allOf:
            - $ref: "#/components/schemas/NotificationSecrets"
          description: |
            Merged into the existing secrets: those given here are replaced,
            others are kept. An empty string removes one.

    NotificationTargetList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationTarget"
        total:
          type: integer

    NotificationTestResult:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
        error:
          type: string
          description: Why sending failed (empty if it worked)

    TemplateNotification:
      type: object
      required: [targetId, targetName, targetKind, events]
      properties:
        targetId:
          type: string
          format: uuid
        targetName:
          type: string
        targetKind:
          $ref: "#/components/schemas/NotificationKind"
        events:
          type: array
          items:
            $ref: "#/components/schemas/NotificationEvent"

    TemplateNotificationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TemplateNotification"

    TemplateNotificationsUpdate:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [targetId, events]
            additionalProperties: false
            properties:
              targetId:
                type: string
                format: uuid
              events:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  $ref: "#/components/schemas/NotificationEvent"

    NotificationDelivery:
      type: object
      required: [id, targetId, targetName, targetKind, event, status, attempts, lastError, createdAt, sentAt, nextAttemptAt]
      properties:
        id:
          type: integer
          format: int64
        targetId:
          type: string
          format: uuid
        targetName:
          type: string
        targetKind:
          $ref: "#/components/schemas/NotificationKind"
        event:
          $ref: "#/components/schemas/NotificationEvent"
        status:
          type: string
          description: "`pending` (not sent yet, or waiting to retry), `sent`, or `failed` for good"
          enum: [pending, sent, failed]
        attempts:
          type: integer
        lastError:
          type: string
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
          description: When a pending notification is next tried

    NotificationDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationDelivery"

    # --- Runner ---

    RunnerJobSpec:
      type: object
      required:
        - jobId
        - jobType
        - command
        - extraVars
        - limit
        - timeoutSeconds
        - inventory
        - credentials
        - project
        - entrypoint
        - arguments
        - tags
        - skipTags
        - verbosity
      properties:
        jobId:
          type: string
          format: uuid
        jobType:
          $ref: "#/components/schemas/JobType"
        command:
          type: array
          items:
            type: string
        extraVars:
          $ref: "#/components/schemas/Variables"
        limit:
          type: string
        timeoutSeconds:
          type: integer
        project:
          allOf:
            - $ref: "#/components/schemas/RunnerProject"
          nullable: true
        entrypoint:
          type: string
        arguments:
          type: array
          items:
            type: string
        tags:
          type: string
        skipTags:
          type: string
        verbosity:
          type: integer
        inventory:
          allOf:
            - $ref: "#/components/schemas/InventoryExport"
          nullable: true
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/RunnerCredential"

    RunnerProject:
      type: object
      description: The git repository to check out
      required: [url, ref, credential]
      properties:
        url:
          type: string
        ref:
          type: string
        credential:
          allOf:
            - $ref: "#/components/schemas/RunnerCredential"
          nullable: true

    RunnerCredential:
      type: object
      required: [id, name, kind, inputs]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/CredentialKind"
        inputs:
          type: object
          description: All field values, secret ones decrypted
          additionalProperties:
            type: string

    RunnerEvent:
      type: object
      required: [seq, type, stdout]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: Starts at 1 and increases by one per event
        type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z_]*$'
        stdout:
          type: string
          maxLength: 65536
        hostName:
          type: string
          maxLength: 255
        data:
          type: object
          additionalProperties: true
        time:
          type: string
          format: date-time

    RunnerEventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/RunnerEvent"

    RunnerJobState:
      type: object
      required: [cancelRequested]
      properties:
        cancelRequested:
          type: boolean
          description: Stop the job and finish it as `canceled`

    RunnerFinish:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [successful, failed, error, canceled]
        exitCode:
          type: integer
        failureReason:
          type: string
          maxLength: 4096
        scmRevision:
          type: string
          maxLength: 255
          description: The commit the project was checked out at
