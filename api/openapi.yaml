openapi: 3.0.3
info:
  title: Dispatch Ops API
  version: 0.6.0
  description: |
    Dispatch Ops runs automation jobs (Ansible, scripts, or any container) on
    Kubernetes. This spec is the source of truth: the Go server, the
    TypeScript client and the runner's client are generated from it.

    Authentication is either a browser session cookie (from `POST /auth/login`
    or single sign-on through `GET /auth/oidc/login`) or an API token sent as
    `Authorization: Bearer <token>`.

    ## Access control
    Roles are granted to users or teams (`/role-grants`), on one inventory,
    credential, project or job template, on every resource of one of those
    types, or globally (`system_admin`, `auditor`). See the `Role` schema.
    Lists only include what the caller may read. A resource the caller may
    not read is reported as not found (404); an action their roles don't
    allow on one they can read is forbidden (403).

    - Creating an inventory, credential, project or job template needs
      `admin` on every resource of that type; whoever creates one gets
      `admin` on it.
    - A job template needs `use` on the project, inventory and credentials
      it references, and a project on its credential. Launching needs
      `execute`, plus `use` on an inventory given at launch.
    - Jobs can be seen by whoever launched them and by anyone with a role on
      their template. Canceling needs `execute` on the template, or having
      launched the job. Relaunching needs `execute` on the template, plus
      `use` on whatever the job used that the template no longer references.
    - Schedules can be seen by anyone who can read their template. Creating
      one needs `execute` on the template (and `use` on an inventory it
      overrides); changing or deleting one needs `admin` on the template, or
      being its creator with `execute`.
    - Notification targets are managed by system administrators. Every
      signed-in user can list them (so template admins can pick one), but
      only system administrators and auditors see their configuration.
      Choosing which targets a template notifies needs `admin` on it.
    - Execution environments can be read and used by everyone, and are
      managed by system administrators. So are users and teams, which every
      signed-in user can list.
    - Read-only (`read` scope) API tokens can only make GET requests.

    ## Conventions
    - List endpoints take `limit` and `offset` and return `{items, total}`.
      Named resources are sorted by name and accept `search` (case-insensitive
      substring match on the name).
    - `PATCH` updates only the fields present in the body. Optional references
      can be cleared with `null`.
    - Errors use RFC 9457 problem details (`application/problem+json`).

    ## Runner API
    Paths under `/runner/v1` are called by the runner inside a job pod. They
    accept only that job's one-time job token, never user credentials.

tags:
  - name: system
  - name: auth
  - name: tokens
  - name: users
  - name: teams
    description: Groups of users. Roles granted to a team apply to its members.
  - name: roles
  - name: audit
  - name: inventories
  - name: credentials
  - name: execution-environments
  - name: projects
  - name: job-templates
  - name: jobs
  - name: schedules
    description: Launch job templates on a cron schedule.
  - name: notifications
    description: Send webhook, Slack or email notifications about jobs.
  - name: runner
    description: Called by the runner inside job pods. Job-token auth only.

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Service health
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a local username and password
      description: Starts a browser session. The session token is set as an HTTP-only cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: Session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              description: Clears the session cookie
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tokens:
    get:
      operationId: listApiTokens
      tags: [tokens]
      summary: List your API tokens
      responses:
        "200":
          description: Your API tokens (secrets are never returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createApiToken
      tags: [tokens]
      summary: Create an API token
      description: |
        The token secret is returned only in this response. Tokens can only be
        created from a browser session, not with another API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiTokenRequest"
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteApiToken
      tags: [tokens]
      summary: Revoke one of your API tokens
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Sign-in methods the server offers
      security: []
      responses:
        "200":
          description: Sign-in configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /api/v1/auth/oidc/login:
    get:
      operationId: oidcLogin
      tags: [auth]
      summary: Start single sign-on (OIDC)
      description: |
        Redirects the browser to the OIDC provider (authorization code flow
        with PKCE). The provider sends it back to `/api/v1/auth/oidc/callback`.
      security: []
      parameters:
        - name: next
          in: query
          description: UI path to return to after signing in
          schema:
            type: string
            maxLength: 2048
      responses:
        "302":
          description: Redirect to the OIDC provider
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: Short-lived cookie holding the login state
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      summary: Finish single sign-on (OIDC)
      description: |
        The OIDC provider redirects the browser here. On success the user is
        created or updated from the ID token's claims, their OIDC-mapped team
        memberships are synced, a session cookie is set, and the browser is
        sent to the page it started from. On failure the browser is sent to
        `/login?error=<message>`.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: state
          in: query
          schema:
            type: string
            maxLength: 1024
        - name: error
          in: query
          schema:
            type: string
            maxLength: 1024
        - name: error_description
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: dispatch_oidc
          in: cookie
          description: The login state set by `GET /api/v1/auth/oidc/login`
          schema:
            type: string
            maxLength: 4096
      responses:
        "302":
          description: Redirect into the UI
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: Session cookie
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Users -----------------------------------------------------------------

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      description: Any signed-in user may list users, to choose who to grant roles to.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: search
          in: query
          description: Case-insensitive substring match on username, display name or email
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a local user
      description: |
        System administrators only. Local users sign in with a password; they
        are mainly for automation (service accounts). OIDC users are created
        when they first sign in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      description: |
        System administrators only. Deactivating a user ends their sessions;
        their API tokens stop working until they are reactivated. OIDC
        users' username, display name and email are updated from the
        provider at each sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      description: |
        System administrators only. Removes the user's tokens, team
        memberships and roles. Jobs they launched are kept. You cannot delete
        yourself.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{userId}/tokens:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: listUserApiTokens
      tags: [tokens]
      summary: List a user's API tokens
      description: System administrators and auditors only.
      responses:
        "200":
          description: The user's API tokens (secrets are never returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createUserApiToken
      tags: [tokens]
      summary: Create an API token for a user
      description: |
        System administrators only, from a browser session. Gives a service
        account a token without signing in as it. The secret is returned only
        in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiTokenRequest"
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{userId}/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteUserApiToken
      tags: [tokens]
      summary: Revoke a user's API token
      description: System administrators only.
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Teams -----------------------------------------------------------------

  /api/v1/teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List teams
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
        - name: userId
          in: query
          description: Only teams this user is a member of
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      description: System administrators only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreate"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a team
      responses:
        "200":
          description: The team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team
      description: |
        System administrators only. Changes to `oidcGroups` apply to each
        member the next time they sign in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: The updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team
      description: System administrators only. The roles granted to the team are revoked.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/teams/{teamId}/members:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: listTeamMembers
      tags: [teams]
      summary: List a team's members
      responses:
        "200":
          description: The team's members, by username
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/teams/{teamId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/UserId"
    put:
      operationId: addTeamMember
      tags: [teams]
      summary: Add a user to a team
      description: |
        System administrators only. Members added here stay members whatever
        their OIDC groups.
      responses:
        "204":
          description: The user is a member
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a user from a team
      description: |
        System administrators only. A member from an OIDC group joins again
        at their next sign-in unless the team's `oidcGroups` change.
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Roles -----------------------------------------------------------------

  /api/v1/role-grants:
    get:
      operationId: listRoleGrants
      tags: [roles]
      summary: List role grants
      description: |
        System administrators and auditors see every grant. Others must
        filter by a resource they administer (`resourceType` and
        `resourceId`), or by themselves (`userId`, which includes the grants
        to their teams).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: resourceType
          in: query
          description: "`global` for system_admin and auditor grants"
          schema:
            type: string
            enum: [global, inventory, credential, project, job_template]
        - name: resourceId
          in: query
          schema:
            type: string
            format: uuid
        - name: userId
          in: query
          description: Grants that apply to this user, directly or through a team
          schema:
            type: string
            format: uuid
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleGrantList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createRoleGrant
      tags: [roles]
      summary: Grant a role
      description: |
        Grants a role to a user or a team. System administrators can grant
        anything. A resource's admins can grant roles on that resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleGrantCreate"
      responses:
        "201":
          description: Role granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/role-grants/{grantId}:
    parameters:
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteRoleGrant
      tags: [roles]
      summary: Revoke a role
      description: System administrators, or an admin of the grant's resource.
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # --- Audit log -------------------------------------------------------------

  /api/v1/audit-log:
    get:
      operationId: listAuditLog
      tags: [audit]
      summary: List audit log entries, newest first
      description: System administrators and auditors only.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: resourceType
          in: query
          schema:
            $ref: "#/components/schemas/AuditResourceType"
        - name: resourceId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            $ref: "#/components/schemas/AuditAction"
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # --- Inventories -----------------------------------------------------------

  /api/v1/inventories:
    get:
      operationId: listInventories
      tags: [inventories]
      summary: List inventories
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: A page of inventories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createInventory
      tags: [inventories]
      summary: Create an inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryCreate"
      responses:
        "201":
          description: Inventory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/inventories/{inventoryId}:
    parameters:
      - $ref: "#/components/parameters/InventoryId"
    get:
      operationId: getInventory
      tags: [inventories]
      summary: Get an inventory
      responses:
        "200":
          description: The inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateInventory
      tags: [inventories]
      summary: Update an inventory
