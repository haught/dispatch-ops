# A production-style Dispatch Ops installation. Create the Secrets it
# names first; see README.md ("Going to production").
apiVersion: dispatch-ops.io/v1alpha1
kind: DispatchOps
metadata:
  name: dispatch-ops
  namespace: dispatch-ops
spec:
  api:
    replicas: 2
    ingress:
      host: dispatch.example.com
      className: nginx
      tlsSecretName: dispatch-ops-tls
    # The API server serves HTTPS itself too (the ingress uses HTTPS to
    # reach it). Without this, the operator generates a self-signed
    # certificate; here a cert-manager Certificate keeps it renewed. See
    # docs/administration.md ("TLS").
    tls:
      secretName: dispatch-ops-api-tls
  taskManager:
    replicas: 2
    # Opt it in first: the chart's allowedJobNamespaces, or (when the
    # operator watches all namespaces) the label
    # dispatch-ops.io/allow-jobs-from=dispatch-ops on the namespace.
    jobNamespace: dispatch-jobs
    maxConcurrentJobs: 20
  # Keep job pods away from in-cluster services as well as cloud metadata:
  # this cluster's pod and service CIDRs.
  networkPolicy:
    jobEgressExcept: [10.244.0.0/16, 10.96.0.0/12]
  database:
    external:
      urlSecret:
        name: dispatch-ops-database
        key: url
  # Back this Secret up: without it, stored credentials can't be decrypted.
  encryptionKeySecret:
    name: dispatch-ops-encryption-key
  externalURL: https://dispatch.example.com
  oidc:
    issuer: https://idp.example.com/realms/corp
    clientID: dispatch-ops
    clientSecret:
      name: dispatch-ops-oidc
      key: client-secret
    scopes: [profile, email, groups]
    displayName: Corp SSO
  # Finished jobs are deleted after 90 days unless set; audit log entries
  # are kept forever unless set.
  retention:
    jobs: 2160h
    auditLog: 8760h
