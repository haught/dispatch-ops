{{- /*
What the operator does in the namespaces it manages. It holds every
permission it grants the task manager in a job namespace (jobs, pods,
secrets, leases), since Kubernetes only lets it grant those.

By default, that is a Role in each watched namespace (watchNamespaces) and
each job namespace (the default ones, <namespace><jobNamespaceSuffix>, and
allowedJobNamespaces), and cluster-wide only `get` on those very namespaces
(their Pod Security label), by name. With watchAllNamespaces, it is a
ClusterRole for every namespace: effectively cluster-admin over Secrets and
workloads (see docs/administration.md, "Operator permissions").
Either way, it may update its own CRD (by name), and its own leader
election Lease is in a Role in the release namespace.
*/ -}}
{{- define "dispatch-ops-operator.rules" -}}
- apiGroups: [dispatch-ops.io]
  resources: [dispatchops]
  verbs: [get, list, watch, update, patch]
- apiGroups: [dispatch-ops.io]
  resources: [dispatchops/status]
  verbs: [get, update, patch]
- apiGroups: [dispatch-ops.io]
  resources: [dispatchops/finalizers]
  verbs: [update]
- apiGroups: [apps]
  resources: [deployments, statefulsets]
  verbs: [get, list, watch, create, update, patch]
# Migrations. The task manager creates job pods' Jobs suspended, starts
# them (patch) and deletes them; the operator deletes an installation's
# when it leaves a job namespace.
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: [""]
  resources: [services, serviceaccounts]
  verbs: [get, list, watch, create, update, patch]
# The operator reads, generates and updates (renewed certificates, TLS to
# the managed database) Secrets; the task manager only creates its job
# Secrets, owned by their Jobs. Neither lists, patches or deletes them.
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, create, update]
# The task manager watches job pods; the operator waits for an
# installation's to stop before it removes their NetworkPolicy.
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [ingresses, networkpolicies]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [roles, rolebindings]
  verbs: [get, list, watch, create, update, patch, delete]
# The task manager's leader election, in its job namespace. The operator
# can only grant what it holds, and the Lease's name is per installation
# (the task manager's Role limits get and update to it), so these can't
# be limited by name here.
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, create, update]
- apiGroups: ["", events.k8s.io]
  resources: [events]
  verbs: [create, patch]
# Claims: the dispatch-ops-claim ConfigMap by which an installation holds
# its namespace and its job namespace (see docs/administration.md, "One
# installation per namespace"). The operator never deletes one: a released
# claim stays as a tombstone, for an administrator to delete ("Released
# namespaces"). Kubernetes can't limit create by name.
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create]
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [dispatch-ops-claim]
  verbs: [get, update]
{{- end }}
{{- $fullname := include "dispatch-ops-operator.fullname" . }}
{{- $labels := include "dispatch-ops-operator.labels" . }}
{{- $sa := include "dispatch-ops-operator.serviceAccountName" . }}
{{- if .Values.watchAllNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  {{- include "dispatch-ops-operator.rules" . | nindent 2 }}
  # The dispatch-ops.io/allow-jobs-from and Pod Security labels on job
  # namespaces.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- $namespaces := include "dispatch-ops-operator.accessibleNamespaces" . | fromJsonArray }}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  {{- include "dispatch-ops-operator.rules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
# The Pod Security label of the namespaces it runs jobs in (by default a
# DispatchOps's own), and only those.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-namespaces
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
    resourceNames:
      {{- range $namespaces }}
      - {{ . | quote }}
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-namespaces
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-namespaces
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# The operator brings the DispatchOps CRD up to its version at startup:
# Helm installs it from crds/ but never upgrades it. A patch can't create an
# object named by resourceNames, so this is that one CRD only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-crd
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [dispatchops.dispatch-ops.io]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-crd
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-crd
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
# The operator's own leader election, in its namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
