# The operator image.
image:
  repository: ghcr.io/haught/dispatch-ops/operator
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# The dispatch-ops server image that DispatchOps resources without
# spec.image run. Upgrading the chart upgrades them to its version.
serverImage:
  repository: ghcr.io/haught/dispatch-ops/server
  # Defaults to the chart's appVersion.
  tag: ""

imagePullSecrets: []

# Replicas elect one active operator.
replicaCount: 1

# Namespaces whose DispatchOps resources the operator manages. It gets a Role
# in each of these and in their job namespaces, and nothing cluster-wide
# beyond reading those namespaces' Pod Security labels; see
# docs/administration.md ("Operator permissions"). None may be the release
# namespace, the operator's own.
watchNamespaces: [dispatch-ops]

# Manage DispatchOps in every namespace instead, with a ClusterRole that can
# read and write every Secret and workload in the cluster: effectively
# cluster-admin. watchNamespaces and jobNamespaceSuffix are then ignored.
watchAllNamespaces: false

# Each watched namespace <namespace> gets its own job namespace,
# <namespace><jobNamespaceSuffix> (dispatch-ops-jobs), where its DispatchOps
# run their jobs unless they set spec.taskManager.jobNamespace. Job pods can
# mount any Secret in their namespace, so a namespace of their own keeps the
# installation's Secrets out of their reach. "" runs jobs in each
# DispatchOps's own namespace.
jobNamespaceSuffix: -jobs

# More namespaces a DispatchOps may run its jobs in (spec.taskManager
# .jobNamespace) besides its own and its default job namespace, each mapped
# to the namespaces whose DispatchOps may use it:
#
#   allowedJobNamespaces:
#     jobs-a: [team-a]
#     jobs-b: [team-b, team-c]
#
# The operator lets the task manager create Jobs, pods and Secrets there,
# and a pod can mount any Secret in its namespace. A job namespace must not
# also be in watchNamespaces (the chart and the operator refuse that): one
# that hosts a DispatchOps holds its encryption key and database Secrets.
# The namespaces they map must be watched, and the operator is given a Role
# in each job namespace. With watchAllNamespaces, a namespace can also opt
# in by itself with the label dispatch-ops.io/allow-jobs-from=<DispatchOps
# namespace>.
#
# A namespace serves exactly one installation, never two: the first to
# claim it (a dispatch-ops-claim ConfigMap, created by the operator) keeps
# it. A DispatchOps whose job namespace another installation holds, hosts a
# DispatchOps, or holds another installation's job objects is refused
# (status reason JobNamespaceInUse), and so is a second DispatchOps in one
# namespace (NamespaceInUse). Once an installation has left a job
# namespace, or been deleted, its claim stays as a tombstone, and the
# namespace isn't handed to another installation (JobNamespaceReleased,
# NamespaceReleased) until an administrator has checked it and deleted the
# tombstone; see docs/administration.md ("Released namespaces").
allowedJobNamespaces: {}

namespaces:
  # Create the watched namespaces, their job namespaces and the
  # installation's, labeled pod-security.kubernetes.io/enforce=restricted,
  # and keep them on uninstall. Namespaces that already exist are left as
  # they are.
  create: true

# The operator refuses to run jobs in a namespace (including a
# DispatchOps's own, the default job namespace) that doesn't enforce Pod
# Security: label it pod-security.kubernetes.io/enforce=restricted (job
# pods comply; baseline is accepted too). Whoever can create or edit a
# DispatchOps chooses the task manager's image, which can create pods in
# the job namespace: without Pod Security, privileged pods with the
# node's filesystem. true lifts that requirement.
allowJobNamespacesWithoutPodSecurity: false

# Where job pods may send DNS queries (port 53, and 5353 to the selected
# pods), so DNS isn't a way around a DispatchOps's
# networkPolicy.jobEgressExcept: label selectors of the cluster DNS pods and
# their namespace, and more resolver CIDRs. A podSelector with an empty
# namespaceSelector selects those pods in every namespace. With both
# selectors empty and no CIDRs, job pods may query DNS anywhere. Set these
# on OpenShift (namespaceSelector kubernetes.io/metadata.name=openshift-dns,
# podSelector dns.operator.openshift.io/daemonset-dns=default) and with
# NodeLocal DNSCache (cidrs: its 169.254.20.10/32, and in iptables mode the
# kube-dns Service's ClusterIP, which it intercepts on the node); see
# docs/administration.md.
jobDNS:
  namespaceSelector: kubernetes.io/metadata.name=kube-system
  podSelector: k8s-app=kube-dns
  cidrs: []

# A NetworkPolicy for the operator pod: its metrics port is reachable from
# any pod but Dispatch Ops job pods.
networkPolicy:
  enabled: true

serviceAccount:
  # Defaults to the release's full name.
  name: ""
  annotations: {}

logLevel: info

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# The Dispatch Ops installation (a DispatchOps resource) for this release's
# operator to run, with the settings `.env` holds in development. false
# leaves creating DispatchOps resources to you (see docs/administration.md).
installation:
  enabled: true
  name: dispatch-ops
  # Defaults to the first of watchNamespaces (dispatch-ops with
  # watchAllNamespaces). It must be watched, and not be the release
  # namespace.
  namespace: ""
  # Keep the DispatchOps (and so the running installation) and the Secrets
  # below when the chart is uninstalled. Losing the encryption key loses every
  # stored credential.
  keep: true

  # DISPATCH_EXTERNAL_URL, DISPATCH_SESSION_TTL, DISPATCH_LOG_LEVEL. Empty
  # means the operator's default.
  externalURL: ""
  sessionTTL: ""
  logLevel: ""

  # An external PostgreSQL. Without url or existingSecret, the operator runs
  # one.
  database:
    # DISPATCH_DATABASE_URL; the chart stores it in the <name>-database Secret.
    url: ""
    # Or a Secret you created holding the URL under existingSecretKey.
    existingSecret: ""
    existingSecretKey: url

  # The credential encryption key. Without key or existingSecret, the operator
  # generates <name>-encryption-key.
  encryptionKey:
    # DISPATCH_ENCRYPTION_KEY (`dispatch-ops gen-key` makes one) and
    # DISPATCH_OLD_ENCRYPTION_KEYS; the chart stores them in the
    # <name>-encryption-key Secret.
    key: ""
    oldKeys: ""
    # Or a Secret you created, with "key" and optionally "oldKeys".
    existingSecret: ""

  # Single sign-on, on when issuer is set. Register
  # <externalURL>/api/v1/auth/oidc/callback as the client's redirect URI.
  oidc:
    issuer: ""
    clientID: ""
    # DISPATCH_OIDC_CLIENT_SECRET; the chart stores it in the <name>-oidc
    # Secret.
    clientSecret: ""
    # Or a Secret you created holding it under existingSecretKey.
    existingSecret: ""
    existingSecretKey: clientSecret
    scopes: []
    usernameClaim: ""
    groupsClaim: ""
    displayName: ""

  # The API server serves HTTPS on port 8443. Without existingSecret, the
  # operator generates a self-signed ECDSA P-384 certificate in
  # <name>-api-tls.
  tls:
    # Serve plain HTTP on 8080 instead; only where something else encrypts
    # traffic to the pods, such as a service mesh.
    enabled: true
    # A kubernetes.io/tls Secret to serve instead, such as a cert-manager
    # Certificate's secretName. Renewals are picked up without a restart.
    # Job pods reach the API at <name>-api.<namespace>.svc, so the
    # Certificate's dnsNames must include that name, and they trust its
    # ca.crt (or, without one, tls.crt and the system's roots).
    existingSecret: ""

  # Any other DispatchOps spec fields (image, api, taskManager, retention,
  # secureCookies, ...); the settings above take precedence.
  # `kubectl explain dispatchops.spec` documents them.
  spec: {}
