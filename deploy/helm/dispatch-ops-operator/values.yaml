# The operator image.
image:
  repository: ghcr.io/haught/dispatch-ops/operator
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# The dispatch-ops server image that DispatchOps resources without
# spec.image run. Upgrading the chart upgrades them to its version.
serverImage:
  repository: ghcr.io/haught/dispatch-ops/server
  # Defaults to the chart's appVersion.
  tag: ""

imagePullSecrets: []

# Replicas elect one active operator.
replicaCount: 1

# Namespaces whose DispatchOps resources the operator manages. Empty means
# all namespaces.
watchNamespaces: []

crds:
  # Install and upgrade the DispatchOps CRD with the chart.
  install: true
  # Keep the CRD (and so every DispatchOps) when the chart is uninstalled.
  keep: true

serviceAccount:
  # Defaults to the release's full name.
  name: ""
  annotations: {}

logLevel: info

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# A Dispatch Ops installation (a DispatchOps resource) for this release's
# operator to run, with the settings `.env` holds in development. Off by
# default: without it, create DispatchOps resources yourself (see README.md).
#
# On a cluster that doesn't have the DispatchOps CRD yet, the first
# `helm install` can only install the CRD; run `helm upgrade` once more with
# the same values to create the installation.
installation:
  enabled: false
  name: dispatch-ops
  # Defaults to the release's namespace. It must exist, and be in
  # watchNamespaces when that's set.
  namespace: ""
  # Keep the DispatchOps (and so the running installation) and the Secrets
  # below when the chart is uninstalled. Losing the encryption key loses every
  # stored credential.
  keep: true

  # DISPATCH_EXTERNAL_URL, DISPATCH_SESSION_TTL, DISPATCH_LOG_LEVEL. Empty
  # means the operator's default.
  externalURL: ""
  sessionTTL: ""
  logLevel: ""

  # An external PostgreSQL. Without url or existingSecret, the operator runs
  # one.
  database:
    # DISPATCH_DATABASE_URL; the chart stores it in the <name>-database Secret.
    url: ""
    # Or a Secret you created holding the URL under existingSecretKey.
    existingSecret: ""
    existingSecretKey: url

  # The credential encryption key. Without key or existingSecret, the operator
  # generates <name>-encryption-key.
  encryptionKey:
    # DISPATCH_ENCRYPTION_KEY (`dispatch-ops gen-key` makes one) and
    # DISPATCH_OLD_ENCRYPTION_KEYS; the chart stores them in the
    # <name>-encryption-key Secret.
    key: ""
    oldKeys: ""
    # Or a Secret you created, with "key" and optionally "oldKeys".
    existingSecret: ""

  # Single sign-on, on when issuer is set. Register
  # <externalURL>/api/v1/auth/oidc/callback as the client's redirect URI.
  oidc:
    issuer: ""
    clientID: ""
    # DISPATCH_OIDC_CLIENT_SECRET; the chart stores it in the <name>-oidc
    # Secret.
    clientSecret: ""
    # Or a Secret you created holding it under existingSecretKey.
    existingSecret: ""
    existingSecretKey: clientSecret
    scopes: []
    usernameClaim: ""
    groupsClaim: ""
    displayName: ""

  # The API server serves HTTPS on port 8443. Without existingSecret, the
  # operator generates a self-signed ECDSA P-384 certificate in
  # <name>-api-tls.
  tls:
    # Serve plain HTTP on 8080 instead; only where something else encrypts
    # traffic to the pods, such as a service mesh.
    enabled: true
    # A kubernetes.io/tls Secret to serve instead, such as a cert-manager
    # Certificate's secretName. Renewals are picked up without a restart.
    # Job pods reach the API at <name>-api.<namespace>.svc, so the
    # Certificate's dnsNames must include that name, and they trust its
    # ca.crt (or, without one, tls.crt and the system's roots).
    existingSecret: ""

  # Any other DispatchOps spec fields (image, api, taskManager, retention,
  # secureCookies, ...); the settings above take precedence.
  # `kubectl explain dispatchops.spec` documents them.
  spec: {}
